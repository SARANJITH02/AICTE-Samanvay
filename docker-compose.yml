services:
  # --------------------------------------------------------------------------
  # 1. PostgreSQL 16 + pgvector + pg_trgm (Internal Only)
  # --------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: samanvay-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aicte_samanvay}
      POSTGRES_USER: ${POSTGRES_USER:-aicte_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SamanvaySecure2026!}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - aicte-internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicte_admin -d aicte_samanvay"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # 2. Air-Gapped Local NLP & AI Microservice (FastAPI - Internal Only)
  # --------------------------------------------------------------------------
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: samanvay-ai-engine
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_OFFLINE=1
      - MODEL_PATH=paraphrase-multilingual-MiniLM-L12-v2
    networks:
      - aicte-internal-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      - postgres

  # --------------------------------------------------------------------------
  # 3. Spring Boot 3 Core Backend (Java 21 - Internal Only)
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: samanvay-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aicte_samanvay}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-aicte_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-SamanvaySecure2026!}
      AI_SERVICE_URL: http://ai-engine:8000
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    networks:
      - aicte-internal-net
    depends_on:
      postgres:
        condition: service_healthy
      ai-engine:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # 4. React 18 Frontend Dashboard (Vite + Nginx)
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: samanvay-frontend
    restart: always
    networks:
      - aicte-internal-net
    depends_on:
      - backend

  # --------------------------------------------------------------------------
  # 5. Production Reverse Proxy Gateway (Single Public Ingress: Port 80)
  # --------------------------------------------------------------------------
  nginx-gateway:
    image: nginx:alpine
    container_name: samanvay-nginx-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - aicte-internal-net
    depends_on:
      - frontend
      - backend

networks:
  aicte-internal-net:
    driver: bridge
    internal: false # External access strictly routed through nginx-gateway port 80

volumes:
  pgdata:
    driver: local
